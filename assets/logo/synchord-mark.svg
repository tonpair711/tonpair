<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="對頻設計 tonpin 標誌">
  <defs>
    <linearGradient id="scg" x1="4" y1="48" x2="60" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#145DA0"/>
      <stop offset="1" stop-color="#19A7CE"/>
    </linearGradient>
  </defs>
  <!-- 兩條反相位的硬質訊號波：等粗、平切端點，沒有金點 -->
  <!-- 交會處用 mask 切出負空間縫隙，不做半透明疊加 → 可單色鋼印與黑白印刷 -->
  <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
    <rect width="64" height="64" fill="#fff"/>
    <path d="M4 32 Q11 13 18 32 T32 32 T46 32 T60 32" stroke="#000" stroke-width="8" fill="none"/>
  </mask>
  <path d="M4 32 Q11 43 18 32 T32 32 T46 32 T60 32" stroke="url(#scg)" stroke-width="3.6" fill="none" stroke-linecap="butt" mask="url(#cut)"/>
  <path d="M4 32 Q11 13 18 32 T32 32 T46 32 T60 32" stroke="url(#scg)" stroke-width="3.6" fill="none" stroke-linecap="butt"/>
</svg>
